name: Build and Release All Platforms (Exe, Deb, Apk)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-release:
  
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Android Build Tools & Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk aapt zipalign apksigner dalvik-exchange

      - name: Build Web Assets & Server Bundle
        run: npm run build

      - name: Build Android APK (v1.0.7)
        run: |
          chmod +x ./scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Create Windows Portable Archive (.exe / .zip bundle)
        run: |
          mkdir -p build-win
          cp -r dist package.json server.ts inventory_store.json build-win/
          cd build-win && zip -r ../stocksync-windows-x64.zip * && cd ..

      - name: Create Debian Package (.deb)
        run: |
          mkdir -p build-deb/usr/local/bin build-deb/DEBIAN
          cat << 'EOF' > build-deb/DEBIAN/control
          Package: stocksync-hub
          Version: 1.0.7
          Section: utils
          Priority: optional
          Architecture: all
          Maintainer: StockSync Team <support@stocksync.local>
          Description: StockSync Hub - Kho Xac Linh Kien & Quan Ly Kiem Ke
          EOF
          cp -r dist build-deb/usr/local/bin/stocksync-dist
          dpkg-deb --build build-deb stocksync-hub_1.0.7_all.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            public/StockSync.apk
            stocksync-hub_1.0.7_all.deb
            stocksync-windows-x64.zip

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            public/StockSync.apk
            stocksync-hub_1.0.7_all.deb
            stocksync-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
