name: Build and Release All Platforms (Exe, Deb, Apk)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Release Package v1.1.4
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Tools
        run: |
          echo "Configuring Android SDK Build-Tools path..."
          LATEST_BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Found Build Tools: $LATEST_BUILD_TOOLS"
          echo "$LATEST_BUILD_TOOLS" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Assets & Server Bundle
        run: |
          ./node_modules/.bin/vite build
          ./node_modules/.bin/esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Build Android APK (v1.1.4)
        run: |
          chmod +x ./scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Create Windows Portable Archive (.zip bundle)
        run: |
          mkdir -p build-win
          cp -r dist package.json server.ts inventory_store.json build-win/
          cd build-win && zip -r ../stocksync-windows-x64.zip * && cd ..

      - name: Create Debian Package (.deb)
        run: |
          mkdir -p build-deb/usr/local/bin build-deb/DEBIAN
          cat << 'EOF' > build-deb/DEBIAN/control
          Package: stocksync-hub
          Version: 1.1.4
          Section: utils
          Priority: optional
          Architecture: all
          Maintainer: StockSync Team <support@stocksync.local>
          Description: StockSync Hub - Kho Xac Linh Kien & Quan Ly Kiem Ke
          EOF
          cp -r dist build-deb/usr/local/bin/stocksync-dist
          dpkg-deb --build build-deb stocksync-hub_1.1.4_all.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-v1.1.4
          path: |
            public/StockSync.apk
            stocksync-hub_1.1.4_all.deb
            stocksync-windows-x64.zip

      - name: Auto-Release to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.1.4
          name: 'StockSync Hub v1.1.4 (Auto-Release)'
          body: |
            ## 🚀 StockSync Hub v1.1.4 - Phiên bản phát hành chính thức
            
            Hệ thống quản lý đối chiếu & quét linh kiện xác kho (IW/OOW) thời gian thực.
            
            ### 📦 Danh sách tệp đính kèm:
            - 📱 **StockSync.apk**: Ứng dụng Android độc lập (Camera QR/Barcode Scanner, Auto-update từ GitHub Releases, Offline Sync).
            - 🪟 **stocksync-windows-x64.zip**: Gói ứng dụng chạy trên máy tính Windows (Hỗ trợ súng quét mã vạch USB/Bluetooth).
            - 🐧 **stocksync-hub_1.1.4_all.deb**: Gói cài đặt chuẩn Debian / Ubuntu Linux.
          draft: false
          prerelease: false
          files: |
            public/StockSync.apk
            stocksync-hub_1.1.4_all.deb
            stocksync-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
