name: Build and Release All Platforms (Exe, Deb, Apk)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release:
  
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Android Build Tools & Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk aapt zipalign apksigner dx

      - name: Build Web Assets & Server Bundle
        run: npm run build

      - name: Build Android APK (v1.0.9)
        run: |
          chmod +x ./scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Create Windows Portable Archive (.exe / .zip bundle)
        run: |
          mkdir -p build-win
          cp -r dist package.json server.ts inventory_store.json build-win/
          cd build-win && zip -r ../stocksync-windows-x64.zip * && cd ..

      - name: Create Debian Package (.deb)
        run: |
          mkdir -p build-deb/usr/local/bin build-deb/DEBIAN
          cat << 'EOF' > build-deb/DEBIAN/control
          Package: stocksync-hub
          Version: 1.0.9
          Section: utils
          Priority: optional
          Architecture: all
          Maintainer: StockSync Team <support@stocksync.local>
          Description: StockSync Hub - Kho Xac Linh Kien & Quan Ly Kiem Ke
          EOF
          cp -r dist build-deb/usr/local/bin/stocksync-dist
          dpkg-deb --build build-deb stocksync-hub_1.0.9_all.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            public/StockSync.apk
            stocksync-hub_1.0.9_all.deb
            stocksync-windows-x64.zip

      - name: Auto-Release to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.9
          name: 'StockSync Hub v1.0.9 (Auto-Release)'
          body: |
            Tự động xuất xưởng các định dạng tệp cho phiên bản v1.0.9:
            - 📱 **StockSync.apk**: Ứng dụng Android (Tương thích Android 5.0 - 14+, Uncompressed DEX, Chữ ký số Release chuẩn).
            - 🐧 **stocksync-hub_1.0.9_all.deb**: Gói cài đặt Debian / Ubuntu Linux.
            - 🪟 **stocksync-windows-x64.zip**: Gói nén di động Windows (.exe / Node.js bundle).
          draft: false
          prerelease: false
          files: |
            public/StockSync.apk
            stocksync-hub_1.0.9_all.deb
            stocksync-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
