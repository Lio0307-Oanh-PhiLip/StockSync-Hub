name: Build and Release Desktop & Web Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build & Release Desktop & Web Packages v1.2.7
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Assets & Server Bundle
        run: |
          ./node_modules/.bin/vite build
          ./node_modules/.bin/esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Create Windows Portable Archive (.zip bundle)
        run: |
          mkdir -p build-win
          cp -r dist package.json server.ts inventory_store.json build-win/
          cd build-win && zip -r ../stocksync-windows-x64.zip * && cd ..

      - name: Create Debian Package (.deb)
        run: |
          mkdir -p build-deb/usr/local/bin build-deb/DEBIAN
          cat << 'EOF' > build-deb/DEBIAN/control
Package: stocksync-hub
Version: 1.2.7
Section: utils
Priority: optional
Architecture: all
Maintainer: StockSync Team <support@stocksync.local>
Description: StockSync Hub - Kho Xac Linh Kien & Quan Ly Kiem Ke
EOF
          cp -r dist build-deb/usr/local/bin/stocksync-dist
          dpkg-deb --build build-deb stocksync-hub_1.2.7_all.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-v1.2.7
          path: |
            stocksync-hub_1.2.7_all.deb
            stocksync-windows-x64.zip

      - name: Auto-Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.7' }}
          name: 'StockSync Hub ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.7' }} (Desktop Packages)'
          body: |
            ## 🚀 StockSync Hub v1.2.7 - Desktop & Server Packages
            
            Gói cài đặt PC / Server đồng bộ dữ liệu thời gian thực.
            
            ### 📦 Danh sách tệp đính kèm:
            - 🪟 **stocksync-windows-x64.zip**: Gói ứng dụng chạy trên máy tính Windows (Hỗ trợ súng quét mã vạch USB/Bluetooth).
            - 🐧 **stocksync-hub_1.2.7_all.deb**: Gói cài đặt chuẩn Debian / Ubuntu Linux.
          draft: false
          prerelease: false
          files: |
            stocksync-hub_1.2.7_all.deb
            stocksync-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
