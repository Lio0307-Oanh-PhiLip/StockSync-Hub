name: Flutter Android APK Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 4. Check Flutter Environment & Doctor
        run: flutter doctor -v

      - name: 5. Install Dependencies
        working-directory: ./mobile-flutter
        run: flutter pub get

      - name: 6. Build Android Release APK
        working-directory: ./mobile-flutter
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: 7. Prepare APK Output Files
        run: |
          mkdir -p release-output
          # Copy APKs from Flutter build directory
          if [ -d "mobile-flutter/build/app/outputs/flutter-apk" ]; then
            cp mobile-flutter/build/app/outputs/flutter-apk/app-release.apk release-output/StockSync.apk || cp mobile-flutter/build/app/outputs/flutter-apk/*.apk release-output/ || true
          fi
          # Fallback to public folder if standalone build
          if [ -f "public/StockSync.apk" ] && [ ! -f "release-output/StockSync.apk" ]; then
            cp public/StockSync.apk release-output/StockSync.apk
          fi
          ls -la release-output/

      - name: 8. Upload Artifact to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: StockSync-Android-APK
          path: release-output/*.apk
          retention-days: 14

      - name: 9. Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.1.5' }}
          name: StockSync Scanner ${{ github.ref_name || 'v1.1.5' }}
          body: |
            ## 📱 StockSync Scanner APK - Official Release
            
            Ứng dụng Quét mã vạch / QR Kho linh kiện xác & đồng bộ Real-time.
            
            ### ✨ Tính năng & Cải tiến:
            - **Chuẩn hóa chữ ký số**: Khắc phục triệt để lỗi Google Play Protect chặn hoặc cảnh báo sai.
            - **Tự động cập nhật**: So khớp phiên bản qua GitHub Releases REST API và tự động cài đè an toàn.
            - **Quét Camera tốc độ cao**: Tối ưu thư viện quét mã và đồng bộ ngay lập tức tới máy chủ.
            
            ### 📥 Hướng dẫn cài đặt APK trên điện thoại:
            1. Tải file `StockSync.apk` đính kèm bên dưới.
            2. Nếu có thông báo bảo mật "Blocked by Play Protect", chọn **Chi tiết khác (More details)** -> **Vẫn cài đặt (Install anyway)**.
            3. Mở ứng dụng và cấp quyền Camera.
          draft: false
          prerelease: false
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
