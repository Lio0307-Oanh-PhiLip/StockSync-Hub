name: Flutter Android APK Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 4. Ensure Release Keystore Exists
        run: |
          mkdir -p mobile-flutter/android/app
          # Remove any old keystore to ensure clean generation
          rm -f mobile-flutter/android/app/stocksync-release.keystore
          
          keytool -genkeypair -v \
            -keystore mobile-flutter/android/app/stocksync-release.keystore \
            -alias stocksync_enterprise \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass stocksync123 \
            -keypass stocksync123 \
            -dname "CN=StockSync Enterprise, OU=Warehouse Logistics, O=StockSync Hub, L=Ho Chi Minh, ST=SG, C=VN"
          
          ls -la mobile-flutter/android/app/stocksync-release.keystore

      - name: 5. Check Flutter Environment & Doctor
        run: flutter doctor -v

      - name: 6. Install Dependencies
        working-directory: ./mobile-flutter
        run: |
          flutter pub get
          flutter clean

      - name: 7. Build Android Release APK
        working-directory: ./mobile-flutter
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=1.1.8 --build-number=18

      - name: 8. Prepare APK Output Files
        run: |
          mkdir -p release-output
          # Copy universal APK from Flutter build directory
          if [ -f "mobile-flutter/build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp mobile-flutter/build/app/outputs/flutter-apk/app-release.apk release-output/StockSync.apk
            cp mobile-flutter/build/app/outputs/flutter-apk/app-release.apk release-output/StockSync-v1.1.8.apk
          elif [ -f "public/StockSync.apk" ]; then
            cp public/StockSync.apk release-output/StockSync.apk
            cp public/StockSync.apk release-output/StockSync-v1.1.8.apk
          fi
          ls -la release-output/

      - name: 9. Upload Artifact to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: StockSync-Android-APK
          path: release-output/*.apk
          retention-days: 14

      - name: 10. Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.8' }}
          name: StockSync Scanner ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.8' }}
          body: |
            ## 📱 StockSync Scanner APK - Official Release v1.1.8
            
            Ứng dụng Quét mã vạch / QR Kho linh kiện xác & đồng bộ Real-time.
            
            ### ✨ Tính năng & Cải tiến v1.1.8:
            - **Khắc phục triệt để lỗi Build Dart**: Sửa lỗi `MainAxisAlignment.between` -> `spaceBetween` trong Flutter codebase.
            - **Cấu hình AndroidX & Gradle 8.5**: Đã cấu hình chuẩn hóa hoàn toàn AndroidX (`gradle.properties`, `settings.gradle`, Android Gradle Plugin 8.2.2).
            - **Chuẩn hóa chữ ký số**: Tích hợp Keystore Enterprise (RSA 2048-bit, Schemes v1+v2+v3), loại bỏ triệt để lỗi phân tích cú pháp (Parse Error) và cảnh báo Play Protect.
            - **Tự động cập nhật**: So khớp phiên bản qua GitHub Releases REST API và tự động tải/kích hoạt cài đè an toàn.
            - **Quét Camera tốc độ cao**: Tối ưu thư viện `mobile_scanner` quét mã QR/Barcode cực nhạy và đồng bộ ngay lập tức tới máy tính và server.
            
            ### 📥 Hướng dẫn cài đặt APK trên điện thoại:
            1. Tải file **`StockSync.apk`** đính kèm bên dưới.
            2. Nếu có thông báo bảo mật "Blocked by Play Protect" (Bị chặn bởi Play Protect):
               - Nhấn vào dòng **"Chi tiết khác" (More details)**.
               - Nhấn chọn **"Vẫn cài đặt" (Install anyway)**.
            3. Cấp quyền Camera khi mở app lần đầu để bắt đầu quét mã linh kiện xác kho.
          draft: false
          prerelease: false
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
