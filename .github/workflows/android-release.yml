name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi=false

      - name: Prepare Release Artifacts
        run: |
          mkdir -p ../dist-apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/StockSync.apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/StockSync-v1.3.0.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StockSync Hub v1.3.0 Live Sync"
          tag_name: ${{ github.ref_name || 'v1.3.0' }}
          generate_release_notes: true
          files: |
            dist-apk/StockSync.apk
            dist-apk/StockSync-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
