name: Flutter Android APK Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 4. Ensure Release Keystore Exists
        run: |
          mkdir -p mobile-flutter/android/app
          # Remove any old keystore to ensure clean generation
          rm -f mobile-flutter/android/app/stocksync-release.keystore
          
          keytool -genkeypair -v \
            -keystore mobile-flutter/android/app/stocksync-release.keystore \
            -alias stocksync_enterprise \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass stocksync123 \
            -keypass stocksync123 \
            -dname "CN=StockSync Enterprise, OU=Warehouse Logistics, O=StockSync Hub, L=Ho Chi Minh, ST=SG, C=VN"
          
          ls -la mobile-flutter/android/app/stocksync-release.keystore

      - name: 5. Check Flutter Environment & Doctor
        run: flutter doctor -v

      - name: 6. Install Dependencies
        working-directory: ./mobile-flutter
        run: |
          flutter clean
          flutter pub get

      - name: 7. Build Android Release APK
        working-directory: ./mobile-flutter
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=1.2.8 --build-number=128

      - name: 8. Build Desktop Windows Bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p build-win
          cp -r dist package.json server.ts inventory_store.json build-win/
          cd build-win && zip -r ../stocksync-windows-x64.zip * && cd ..

      - name: 9. Prepare Release Output Files
        run: |
          mkdir -p release-output
          # Universal release APK
          if [ -f "mobile-flutter/build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp mobile-flutter/build/app/outputs/flutter-apk/app-release.apk release-output/StockSync.apk
            cp mobile-flutter/build/app/outputs/flutter-apk/app-release.apk release-output/StockSync-v1.2.8.apk
          fi
          # Desktop Windows zip
          if [ -f "stocksync-windows-x64.zip" ]; then
            cp stocksync-windows-x64.zip release-output/
          fi
          ls -la release-output/

      - name: 10. Upload Artifact to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: StockSync-Release-Packages-v1.2.8
          path: release-output/*
          retention-days: 14

      - name: 11. Create Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.8' }}
          name: StockSync Scanner ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.8' }}
          body: |
            ## 📱 StockSync Hub & Scanner - Official Release v1.2.8
            
            Ứng dụng Quản lý & Quét mã vạch Kho xác linh kiện (Tích hợp sẵn 312 linh kiện & Đồng bộ 2 chiều Realtime).
            
            ### ✨ Tính năng & Cải tiến v1.2.8:
            - **TÍCH HỢP SẴN 312 LINH KIỆN KHO XÁC**: Ứng dụng tự chứa đầy đủ cơ sở dữ liệu kho OPPO (Phú Lâm VN001021). Mở app là có ngay toàn bộ danh sách linh kiện mà không cần chờ mạng!
            - **ĐỒNG BỘ 2 CHIỀU REALTIME (WEBSOCKET + HTTP FALLBACK)**:
              - Quét trên điện thoại cập nhật tức thời lên máy tính.
              - Quét trên máy tính cập nhật tức thời về điện thoại.
              - Tự động giữ kết nối (Heartbeat Ping/Pong) và hỗ trợ HTTP REST dự phòng.
            - **GIAO DIỆN MỚI 3 TAB CHUYÊN NGHIỆP**:
              - Tab 1: **Quét Camera** (Khung ngắm laze, hỗ trợ đèn flash, hiển thị kết quả khớp/không khớp).
              - Tab 2: **Danh Sách Kho** (Tìm kiếm tức thì theo Số RO, Mã LK, Model; Lọc OOW/IW; Nút quét 1 chạm; Kéo xuống để đồng bộ lại).
              - Tab 3: **Kết Nối PC** (Nhận diện mã QR PC Hub tự động, hiển thị trạng thái kết nối trực quan).
            - **KHẮC PHỤC TRIỆT ĐỂ LỖI CÀI ĐẶT & CHỮ KÝ SỐ**:
              - Ký chuẩn V1 và V2 Signing Scheme.
              - Package ID chuẩn: `com.stocksync.hub.scanner`.
              - Đầy đủ bộ biểu tượng Adaptive Launcher Icons cho mọi dòng Android.
            
            ### 📥 Hướng dẫn cài đặt APK trên điện thoại:
            1. Tải file **`StockSync.apk`** (hoặc `StockSync-v1.2.8.apk`) đính kèm bên dưới.
            2. Nếu có thông báo bảo mật "Blocked by Play Protect" (Bị chặn bởi Play Protect):
               - Nhấn vào dòng **"Chi tiết khác" (More details)**.
               - Nhấn chọn **"Vẫn cài đặt" (Install anyway)**.
            3. Cấp quyền Camera khi mở app lần đầu để bắt đầu quét mã linh kiện xác kho.
          draft: false
          prerelease: false
          files: release-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
