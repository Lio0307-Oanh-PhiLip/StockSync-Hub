name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Phiên bản phát hành (vd: v1.3.0)'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - uses: actions/checkout@v4

      - name: Determine Version Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.3.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected release tag: $TAG"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Release Keystore if missing
        run: |
          if [ ! -f android/app/stocksync-release.keystore ]; then
            echo "Tự động tạo Release Keystore để ký file APK..."
            keytool -genkey -v -keystore android/app/stocksync-release.keystore \
              -alias stocksync_enterprise -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass stocksync123 -keypass stocksync123 \
              -dname "CN=StockSync Hub, OU=Warehouse, O=StockSync, L=HCM, ST=HCM, C=VN"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p ../dist-apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/StockSync.apk
          TAG_VAL="${{ steps.tag_info.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/StockSync-${TAG_VAL}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StockSync Hub ${{ steps.tag_info.outputs.tag }} Live Sync"
          tag_name: ${{ steps.tag_info.outputs.tag }}
          generate_release_notes: true
          files: |
            dist-apk/StockSync.apk
            dist-apk/StockSync-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
