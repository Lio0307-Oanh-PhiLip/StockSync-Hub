name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Release Keystore if missing
        run: |
          if [ ! -f android/app/stocksync-release.keystore ]; then
            echo "Tự động tạo Release Keystore để ký file APK..."
            keytool -genkey -v -keystore android/app/stocksync-release.keystore \
              -alias stocksync_enterprise -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass stocksync123 -keypass stocksync123 \
              -dname "CN=StockSync Hub, OU=Warehouse, O=StockSync, L=HCM, ST=HCM, C=VN"
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi=false

      - name: Prepare Release Artifacts
        run: |
          mkdir -p ../dist-apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/StockSync.apk
          TAG_VAL="${{ github.ref_name }}"
          if [ -z "$TAG_VAL" ] || [ "$TAG_VAL" = "main" ]; then
            TAG_VAL="v1.3.0"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apk/StockSync-${TAG_VAL}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StockSync Hub ${{ github.ref_name || 'v1.3.0' }} Live Sync"
          tag_name: ${{ github.ref_name || 'v1.3.0' }}
          generate_release_notes: true
          files: |
            dist-apk/StockSync.apk
            dist-apk/StockSync-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
